[package]
name = "imposer"
version = "0.1.0"
edition = "2024"
description = "Imposition de documents PDF sur des planches aux formats A4, A3, SRA3..."
license = "MIT"

[[bin]]
name = "imposer"
path = "src/main.rs"

[lib]
name = "imposer"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.45"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"