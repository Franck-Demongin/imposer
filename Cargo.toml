[package]
name = "imposer"
version = "0.3.5"
edition = "2024"
description = "Imposition de documents PDF sur des planches aux formats A4, A3, SRA3..."
license = "MIT"

[[bin]]
name = "imposer"
path = "src/main.rs"

[lib]
name = "imposer"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.45"
thiserror = "2.0"
ratatui = "0.29"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
psd = "0.3.5"
zune-psd = "0.5.1"
moxcms = "0.8.1"
sha2 = "0.10"
flate2 = "1.1"
hex = "0.4"
chrono = "0.4"
quick-xml = "0.38"
uuid = "1.26"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }