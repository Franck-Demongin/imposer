<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Imposer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26365C"/>
      <stop offset="1" stop-color="#101A31"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EAF4"/>
    </linearGradient>
  </defs>

  <!-- Fond : carré arrondi -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>

  <!-- Traits de coupe autour de la feuille -->
  <g stroke="#8FB4FF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M30 62 H40 M50 42 V52"/>
    <path d="M226 62 H216 M206 42 V52"/>
    <path d="M30 194 H40 M50 214 V204"/>
    <path d="M226 194 H216 M206 214 V204"/>
  </g>

  <!-- Feuille (format paysage) -->
  <rect x="44" y="68" width="168" height="120" rx="6" fill="#000" opacity="0.25" transform="translate(0 4)"/>
  <rect x="44" y="68" width="168" height="120" rx="6" fill="url(#sheet)"/>

  <!-- Poses : rangée du haut (recto) C M J N -->
  <rect x="56"    y="80"  width="31.5" height="45" rx="2" fill="#00AEEF"/>
  <rect x="93.5"  y="80"  width="31.5" height="45" rx="2" fill="#EC008C"/>
  <rect x="131"   y="80"  width="31.5" height="45" rx="2" fill="#FFD500"/>
  <rect x="168.5" y="80"  width="31.5" height="45" rx="2" fill="#231F20"/>

  <!-- Rangée du bas (verso) en miroir -->
  <rect x="56"    y="131" width="31.5" height="45" rx="2" fill="#231F20"/>
  <rect x="93.5"  y="131" width="31.5" height="45" rx="2" fill="#FFD500"/>
  <rect x="131"   y="131" width="31.5" height="45" rx="2" fill="#EC008C"/>
  <rect x="168.5" y="131" width="31.5" height="45" rx="2" fill="#00AEEF"/>
</svg>
